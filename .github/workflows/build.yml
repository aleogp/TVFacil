name: Armar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Poner las VPN (desde los secrets)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          mkdir -p app/src/main/assets/vpn
          # Cada secret que empiece con WG_ se vuelve una VPN: WG_USA -> usa.conf
          for k in $(echo "$SECRETS_JSON" | jq -r 'keys[] | select(startswith("WG_"))'); do
            name=$(echo "${k#WG_}" | tr 'A-Z' 'a-z')
            echo "$SECRETS_JSON" | jq -r --arg k "$k" '.[$k]' > "app/src/main/assets/vpn/$name.conf"
          done
          echo "VPN incluidas:"; ls app/src/main/assets/vpn

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk TVFacil.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.${{ github.run_number }}
          name: TV Fácil v3.${{ github.run_number }}
          files: TVFacil.apk
          make_latest: true
